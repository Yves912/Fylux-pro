    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('FYLUX-PRO: Service Worker activé.');
                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    document.getElementById('updateToast').classList.remove('hidden');
                                }
                            };
                        };
                    });
            });
        }

        function forceApplicationUpdate() {
            if (confirm("Forcer la mise à jour du système ? (Vos notes locales seront conservées)")) {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        for (let registration of registrations) registration.unregister();
                    });
                }
                if ('caches' in window) {
                    caches.keys().then(names => {
                        for (let name of names) caches.delete(name);
                    });
                }
                window.location.reload(true);
            }
        }
    </script>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col antialiased transition-colors duration-300">

    <main class="container mx-auto flex-1 p-4 lg:p-6 transition-all duration-300">
        
        <section id="page-consigner" class="block w-full max-w-5xl mx-auto space-y-6 animate-in fade-in duration-500">
            
            <form id="noteForm" class="space-y-6">

                    <div class="flex justify-between items-center border-b border-slate-700/50 pb-3">

                            <span id="editorStatusIndicator" class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] block"></span> 
                            <span class="lang-fr">Consigner une note</span><span class="lang-en hidden">Log a new lecture note</span>
                        </h2>
                        <div class="flex gap-3">
                            <button type="submit" id="submitBtn" class="bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-slate-950 font-bold py-2 px-6 rounded-xl transition shadow-lg cursor-pointer text-xs uppercase">
                                <span class="lang-fr">Enregistrer</span><span class="lang-en hidden">Save</span>

                            </select>
                        </div>

                </div>

                <div class="bg-slate-850 rounded-2xl border border-slate-700/50 shadow-xl overflow-hidden flex flex-col">
                    <div class="flex flex-col bg-slate-900 p-3 gap-3 border-b border-slate-700/50">

                                    <option value="font-sans-custom">Aptos (Body)</option>

                                    <option value="font-mono-custom">Consolas (Terminal)</option>
                                </select>
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onclick="openSketchpad()" class="text-xs px-3 py-1.5 bg-cyan-950 hover:bg-cyan-900 text-cyan-400 rounded-lg border border-cyan-900/50 transition cursor-pointer font-bold">🎨 Croquis</button>
                                <label class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition cursor-pointer font-bold">
                                    📷 Images <input type="file" id="imageUpload" accept="image/*" multiple class="hidden" onchange="handleMultiImageUpload(this)">

                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-1.5 text-sm font-mono">
                            <button type="button" onclick="execCmd('bold')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded font-bold text-slate-100 transition cursor-pointer">B</button>
                            <button type="button" onclick="execCmd('italic')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded italic text-slate-100 transition cursor-pointer">I</button>
                            <button type="button" onclick="execCmd('underline')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded underline text-slate-100 transition cursor-pointer">U</button>
                            <button type="button" onclick="execCmd('strikeThrough')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded line-through text-slate-400 transition cursor-pointer">̶S̶</button>
                            <button type="button" onclick="execCmd('subscript')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded text-xs text-cyan-400 transition cursor-pointer">X₂</button>
                            <button type="button" onclick="execCmd('superscript')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded text-xs text-cyan-400 transition cursor-pointer">X²</button>
                            <div class="h-5 w-[1px] bg-slate-700 mx-1"></div>
                            <button type="button" onclick="execCmd('hiliteColor', '#eab308')" class="px-3 h-8 bg-amber-950/60 hover:bg-amber-900 text-amber-400 rounded border border-amber-900/40 text-xs transition cursor-pointer">✨ Highlight</button>
                            <button type="button" onclick="execCmd('insertUnorderedList')" class="w-9 h-8 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition cursor-pointer">•</button>
                        </div>
                    </div>
                    
                    <div id="contentInput" contenteditable="true" placeholder="Commencez à rédiger vos explications ici... Utilisez '-', '*' ou '>' pour les raccourcis."

                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-cyan-500/50 text-slate-200 text-sm">

                <button onclick="saveCanvasToNote()" class="px-4 py-2 bg-cyan-600 text-slate-950 rounded-lg font-bold hover:bg-cyan-500 cursor-pointer">Injecter</button>

    <div id="trashModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">

            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-sm font-mono text-red-400 font-bold">🗑️ CORBEILLE</h3>
                <button onclick="toggleTrashModal()" class="text-slate-500 hover:text-slate-300 font-bold cursor-pointer">✕</button>

            <div id="trashContainer" class="max-h-60 overflow-y-auto space-y-2 pr-1 text-xs font-mono"></div>
            <div class="flex justify-between pt-4 border-t border-slate-800">
                <button onclick="emptyTrashPermanently()" class="text-red-400 hover:underline text-xs">Purger tout</button>

    <div id="iosInstallPrompt" class="hidden fixed bottom-6 left-6 right-6 bg-slate-850 border border-cyan-500/30 p-5 rounded-2xl shadow-2xl z-50 max-w-md mx-auto">

            <div class="bg-cyan-950 p-2.5 rounded-xl text-cyan-400 text-2xl">📲</div>
            <div class="flex-1">
                <p class="text-slate-200 font-bold text-sm">Installez Fylux-pro sur iPhone :</p>
                <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">Appuyez sur <span class="bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700 text-cyan-400 font-bold font-mono text-[10px]">Partager ↑</span> puis sur <span class="text-cyan-400 font-bold">"Sur l'écran d'accueil"</span>.</p>
            </div>
            <button onclick="document.getElementById('iosInstallPrompt').remove()" class="text-slate-500 hover:text-slate-300">✕</button>
        </div>
    </div>

    <footer class="bg-slate-850 border-t border-slate-800 text-slate-500 text-center py-5 text-[10px] font-mono tracking-widest mt-12">
        STORAGE_LOCAL_ENCRYPT // BY <span class="text-cyan-500 font-extrabold">FYLUX_Yves Matimbia</span>
    </footer>

    <script>
        // Nodes
        const noteForm = document.getElementById('noteForm');
        const noteIdInput = document.getElementById('noteIdInput');
        const courseInput = document.getElementById('courseInput');
        const dateInput = document.getElementById('dateInput');
        const degreeInput = document.getElementById('degreeInput');
        const contentInput = document.getElementById('contentInput');
        const foldersContainer = document.getElementById('foldersContainer');
        const noteCount = document.getElementById('noteCount');
        const trashCount = document.getElementById('trashCount');
        const searchInput = document.getElementById('searchInput');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editorTitle = document.getElementById('editorTitle');
        const mediaPreviewArea = document.getElementById('mediaPreviewArea');
        const imagesPreviewContainer = document.getElementById('imagesPreviewContainer');

        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        let notes = JSON.parse(localStorage.getItem('uni_notes')) || [];
        let trash = JSON.parse(localStorage.getItem('uni_trash')) || [];
        let currentMediaArray = []; 
        let currentLang = localStorage.getItem('fylux_lang') || 'fr';

        dateInput.value = new Date().toISOString().split('T')[0];
        changeLanguage(currentLang);

        window.switchTab = function(tabName) {
            const btnConsigner = document.getElementById('tab-consigner');
            const btnDossiers = document.getElementById('tab-dossiers');
            const pageConsigner = document.getElementById('page-consigner');
            const pageDossiers = document.getElementById('page-dossiers');

            if(tabName === 'consigner') {
                pageConsigner.classList.remove('hidden');
                pageDossiers.classList.add('hidden');
                btnConsigner.className = "px-4 py-1.5 text-xs font-medium rounded-md bg-cyan-600 text-slate-950 shadow-md cursor-pointer";
                btnDossiers.className = "px-4 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 cursor-pointer";
            } else {
                pageConsigner.classList.add('hidden');
                pageDossiers.classList.remove('hidden');
                btnDossiers.className = "px-4 py-1.5 text-xs font-medium rounded-md bg-cyan-600 text-slate-950 shadow-md cursor-pointer";
                btnConsigner.className = "px-4 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 cursor-pointer";
                displayFolders();
            }
        };

        window.execCmd = (command, value = null) => { document.execCommand(command, false, value); contentInput.focus(); };

        contentInput.addEventListener('keydown', function(e) {
            if (e.key === ' ') {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);
                const text = range.startContainer.textContent || "";
                const before = text.substring(0, range.startOffset);

                if (before === '-' || before === '+' || before === '*') {
                    e.preventDefault();
                    document.execCommand('delete', false, null);
                    document.execCommand('insertUnorderedList', false, null);
                } else if (before === '>') {
                    e.preventDefault();
                    document.execCommand('delete', false, null);
                    document.execCommand('formatBlock', false, 'blockquote');
                }
            }
        });

        window.changeEditorFont = (f) => contentInput.className = `w-full px-6 py-6 bg-slate-850 focus:outline-none text-slate-200 transition text-base leading-relaxed min-h-[500px] overflow-y-auto ${f}`;

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('fylux_lang', lang);
            const fr = document.querySelectorAll('.lang-fr'), en = document.querySelectorAll('.lang-en');
            if(lang === 'en') {
                fr.forEach(e => e.classList.add('hidden')); en.forEach(e => e.classList.remove('hidden'));
                courseInput.placeholder = "Example: Math, Biology..."; searchInput.placeholder = "Search keywords...";
                contentInput.setAttribute('placeholder', "Start typing your notes...");
            } else {
                fr.forEach(e => e.classList.remove('hidden')); en.forEach(e => e.classList.add('hidden'));
                courseInput.placeholder = "Ex: Algorithmique, Économie..."; searchInput.placeholder = "Rechercher...";
                contentInput.setAttribute('placeholder', "Commencez à rédiger vos explications ici...");
            }
            displayFolders();
        }

        window.handleMultiImageUpload = (input) => {
            Array.from(input.files).forEach(file => {
                const r = new FileReader();
                r.onload = (e) => { currentMediaArray.push(e.target.result); renderMediaPreviews(); };
                r.readAsDataURL(file);
            });
        };

        function renderMediaPreviews() {
            imagesPreviewContainer.innerHTML = "";
            if(currentMediaArray.length === 0) return mediaPreviewArea.classList.add('hidden');
            mediaPreviewArea.classList.remove('hidden');
            currentMediaArray.forEach((img, i) => {
                const d = document.createElement('div');
                d.className = "relative w-24 h-16 border border-slate-700 rounded-lg overflow-hidden";
                d.innerHTML = `<img src="${img}" class="w-full h-full object-cover"><button type="button" onclick="removeImage(${i})" class="absolute top-0 right-0 bg-red-600 text-white text-[8px] px-1 font-bold">X</button>`;
                imagesPreviewContainer.appendChild(d);
            });
        }

        window.removeImage = (i) => { currentMediaArray.splice(i, 1); renderMediaPreviews(); };

        window.openSketchpad = () => { document.getElementById('sketchpadModal').classList.remove('hidden'); clearCanvas(); };
        window.closeSketchpad = () => document.getElementById('sketchpadModal').classList.add('hidden');
        window.clearCanvas = () => { ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = "#22d3ee"; ctx.lineWidth = 3; ctx.lineCap = "round"; };
        const getPos = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; };
        canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
        canvas.onmousemove = (e) => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        canvas.onmouseup = () => drawing = false;
        canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); e.preventDefault(); };
        canvas.ontouchmove = (e) => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
        canvas.ontouchend = () => drawing = false;
        window.saveCanvasToNote = () => { currentMediaArray.push(canvas.toDataURL()); renderMediaPreviews(); closeSketchpad(); };

        noteForm.onsubmit = (e) => {
            e.preventDefault();
            const id = noteIdInput.value, course = courseInput.value.trim(), date = dateInput.value, deg = degreeInput.value, content = contentInput.innerHTML.trim();
            if (id) {
                notes = notes.map(n => n.id == id ? { ...n, course, date, degree: deg, content, mediaList: [...currentMediaArray] } : n);
            } else {
                notes.push({ id: Date.now(), createdAt: new Date().toISOString(), course, date, degree: deg, content, mediaList: [...currentMediaArray] });
            }
            saveNotes(); resetEditor(); switchTab('dossiers');
        };

        const saveNotes = () => { localStorage.setItem('uni_notes', JSON.stringify(notes)); localStorage.setItem('uni_trash', JSON.stringify(trash)); displayFolders(); };

        window.editNote = (id, ev) => {
            ev.stopPropagation(); const n = notes.find(n => n.id == id); if (!n) return;
            switchTab('consigner'); noteIdInput.value = n.id; courseInput.value = n.course; dateInput.value = n.date; degreeInput.value = n.degree || "💡 Normal"; contentInput.innerHTML = n.content; currentMediaArray = n.mediaList ? [...n.mediaList] : []; renderMediaPreviews();
            editorTitle.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-500 block"></span> MODE ÉDITION`;
            submitBtn.textContent = "METTRE À JOUR"; submitBtn.className = "flex-1 bg-amber-600 text-slate-950 font-bold py-2 px-6 rounded-xl cursor-pointer"; cancelEditBtn.classList.remove('hidden');
        };

        window.resetEditor = () => {
            noteForm.reset(); noteIdInput.value = ""; contentInput.innerHTML = ""; currentMediaArray = []; renderMediaPreviews();
            editorTitle.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-cyan-400 block"></span> CONSIGNER UNE NOTE`;
            submitBtn.textContent = currentLang === 'fr' ? "ENREGISTRER" : "SAVE"; submitBtn.className = "flex-1 bg-cyan-600 text-slate-950 font-bold py-2 px-6 rounded-xl cursor-pointer"; cancelEditBtn.classList.add('hidden');
        };

        window.deleteNote = (id, ev) => { ev.stopPropagation(); const idx = notes.findIndex(n => n.id === id); if(idx > -1) { trash.push(notes.splice(idx, 1)[0]); saveNotes(); } };
        window.toggleTrashModal = () => { const m = document.getElementById('trashModal'); m.classList.toggle('hidden'); if(!m.classList.contains('hidden')) displayTrash(); };
        const displayTrash = () => {
            const c = document.getElementById('trashContainer'); c.innerHTML = "";
            if(trash.length === 0) return c.innerHTML = `<div class="text-center py-4">Vide.</div>`;
            trash.forEach(i => {
                const d = document.createElement('div'); d.className = "flex justify-between py-2 border-b border-slate-800";
                d.innerHTML = `<div class="truncate max-w-[70%]"><b>[${i.course}]</b> ${i.content}</div><button onclick="restoreNote(${i.id})" class="text-cyan-400">[RESTAURER]</button>`;
                c.appendChild(d);
            });
        };
        window.restoreNote = (id) => { const idx = trash.findIndex(n => n.id === id); if(idx > -1) { notes.push(trash.splice(idx, 1)[0]); saveNotes(); displayTrash(); } };
        window.emptyTrashPermanently = () => { if(confirm("Tout supprimer ?")) { trash = []; saveNotes(); displayTrash(); } };

        window.printPDF = (id, ev) => {
            ev.stopPropagation(); const n = notes.find(n => n.id == id); if (!n) return;
            let imgs = ""; (n.mediaList || []).forEach(img => imgs += `<img src="${img}" style="max-width: 45%; margin:10px;">`);
            document.getElementById('printSection').innerHTML = `<h1 style="font-family:monospace;">[ ${n.course.toUpperCase()} ]</h1><p>Session du ${n.date}</p><hr><div style="white-space:pre-wrap;">${n.content}</div><div>${imgs}</div>`;
            window.print();
        };

        function displayFolders() {
            const s = searchInput.value.toLowerCase();
            const f = notes.filter(n => n.course.toLowerCase().includes(s) || n.content.toLowerCase().includes(s));
            const g = {}; f.forEach(n => { if (!g[n.course]) g[n.course] = []; g[n.course].push(n); });
            noteCount.textContent = `${Object.keys(g).length} MODULES`; trashCount.textContent = trash.length;
            foldersContainer.innerHTML = '';
            if (Object.keys(g).length === 0) return foldersContainer.innerHTML = `<div class="text-center p-12 text-slate-500 font-mono">AUCUNE NOTE TROUVÉE.</div>`;
            for (const c in g) {
                const ns = g[c].sort((a,b) => new Date(b.date) - new Date(a.date));
                const d = document.createElement('div'); d.className = "bg-slate-850 rounded-2xl border border-slate-800 shadow-md overflow-hidden";
                d.innerHTML = `<div onclick="this.nextElementSibling.classList.toggle('hidden')" class="p-4 flex justify-between cursor-pointer border-b border-slate-800"><b>📁 ${c.toUpperCase()}</b><span class="text-xs text-slate-500">${ns.length} Sessions</span></div><div class="hidden bg-slate-900/40 divide-y divide-slate-800">${ns.map(n => `
                    <div class="p-4 space-y-2">
                        <div class="flex justify-between text-[10px] font-mono"><span class="text-cyan-400">🗓️ ${n.date}</span><div class="flex gap-2"><button onclick="printPDF(${n.id}, event)" class="text-cyan-500">[PDF]</button><button onclick="editNote(${n.id}, event)" class="text-slate-400">[EDIT]</button><button onclick="deleteNote(${n.id}, event)" class="text-slate-500">[DELETE]</button></div></div>
                        <div class="text-xs text-slate-300 line-clamp-3">${n.content}</div>
                    </div>`).join('')}</div>`;
                foldersContainer.appendChild(d);
            }
        }
        function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }
        if (/iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase()) && !navigator.standalone) setTimeout(() => document.getElementById('iosInstallPrompt').classList.remove('hidden'), 3000);
        searchInput.oninput = displayFolders; displayFolders();
    </script>
</body>
</html>
